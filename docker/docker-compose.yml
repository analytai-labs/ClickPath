version: "3.8"

name: clickpath
services:
  database:
    image: postgres:16-alpine
    container_name: clickpath_db
    environment:
      - POSTGRES_DB=clickpath
      - POSTGRES_USER=clickpath
      - POSTGRES_PASSWORD=clickpath
    ports:
      - "5435:5432"
    volumes:
      - clickpathdb:/var/lib/postgresql/data

  cache:
    image: redis:latest
    container_name: clickpath_cache
    ports:
      - "6379:6379"
    volumes:
      - clickpathcache:/var/lib/redis/data

volumes:
  clickpathdb:
  clickpathcache:
